[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geomoz"
version = "1.0.0"
description = "Geospatial data library for Mozambique with automatic Hugging Face integration"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Geolithica Team", email = "contact@geolithica.org"}
]
maintainers = [
    {name = "Geolithica Team", email = "contact@geolithica.org"}
]
keywords = [
    "geospatial",
    "mozambique", 
    "gis",
    "geopandas",
    "shapefile",
    "geology",
    "administrative-boundaries",
    "huggingface",
    "spatial-data",
    "africa",
    "geology-mapping",
    "crs",
    "utm",
    "shapefile",
    "gpkg",
    "geopackage",
    "spatial-analysis",
    "mapping",
    "geoscience"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Geoscience",
]
requires-python = ">=3.8"
dependencies = [
    "geopandas>=0.14.0",
    "pandas>=1.5.0",
    "shapely>=2.0.0",
    "huggingface_hub>=0.10.0",
    "requests>=2.25.0",
    "typing-extensions>=4.0.0"
]

[project.optional-dependencies]
complete = [
    "matplotlib>=3.5.0",
    "folium>=0.12.0",
    "contextily>=1.2.0",
    "seaborn>=0.11.0"
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
    "twine>=4.0.0",
    "wheel>=0.37.0",
    "build>=0.7.0"
]

[project.urls]
Homepage = "https://github.com/geolithicamz/geomoz"
Documentation = "https://github.com/geolithicamz/geomoz/blob/main/README.md"
Repository = "https://github.com/geolithicamz/geomoz"
"Bug Tracker" = "https://github.com/geolithicamz/geomoz/issues"
"Hugging Face" = "https://huggingface.co/geolithicamz/geomoz-data"

[tool.setuptools]
packages = ["geomoz"]

[tool.setuptools.package-data]
geomoz = ["data/*.md"]
